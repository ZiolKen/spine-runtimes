name: Build spine-godot (Windows editor + iOS template)

on:
  workflow_dispatch:
    inputs:
      godot_tag:
        description: "Godot tag, vd 4.5.1-stable"
        required: true
        default: "4.5.1-stable"

env:
  GODOT_TAG: ${{ inputs.godot_tag }}
  GODOT_MONO: false

jobs:
  godot-editor-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup python and scons
        uses: ./.github/actions/setup-godot-deps-4

      - name: Setup Godot and Spine
        run: ./spine-godot/build/setup.sh $GODOT_TAG false $GODOT_MONO
        shell: bash

      - name: Install Godot D3D12 SDK
        working-directory: ./spine-godot/godot
        run: python misc/scripts/install_d3d12_sdk_windows.py

      - name: Build Godot
        run: ./spine-godot/build/build-v4.sh $GODOT_MONO
        shell: bash

      - name: Upload editor
        uses: actions/upload-artifact@v4
        with:
          name: godot-editor-windows-${{ inputs.godot_tag }}
          path: spine-godot/godot/bin/**/*
          if-no-files-found: error

  godot-template-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup python and scons
        uses: ./.github/actions/setup-godot-deps-4

      - name: Build iOS template
        run: |
          ./spine-godot/build/install-macos-vulkan-sdk.sh
          ./spine-godot/build/setup.sh $GODOT_TAG false
          ./spine-godot/build/build-templates-v4.sh ios

      - name: Upload iOS template
        uses: actions/upload-artifact@v4
        with:
          name: godot-template-ios-${{ inputs.godot_tag }}
          path: spine-godot/godot/bin/ios.zip
          if-no-files-found: error
